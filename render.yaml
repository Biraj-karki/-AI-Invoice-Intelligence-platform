databases:
  - name: ai-invoice-demo-db
    databaseName: invoice_db
    user: invoice_user
    plan: free
    region: singapore
    postgresMajorVersion: 17

services:
  - type: web
    name: ai-invoice-demo-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-invoice-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://ai-invoice-demo-frontend.onrender.com
      - key: ALLOW_REGISTRATION
        value: true

  - type: web
    name: ai-invoice-demo-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://ai-invoice-demo-api.onrender.com
